<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<style>
   @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap');
    *
    {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root
    {
      --bg: #FFF8E7;
      --txt: rgb(117, 14, 14);
      --bgtwo:rgb(205, 38, 38);
    }
    html, body
    {
      background-color: var(--bg);
    }
    .navbar
    {
      width: 100%;
      height: 80px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      flex-wrap: wrap;
    }
    .logo
    {
        width: 120px;
        font-size: 25px;
        text-align: center;
        font-weight: 300;
        color: var(--txt);
    }
    .nav-cntr
    {
      display: flex;
      flex-direction: row;
      gap: 20px;
    }
    .nav-cntr a
    {
      text-decoration: none;
      color: white;
      font-size: 17px;
    }
    .nav-rgt i
    {
      font-size: 25px;
      color: #000;
    }
    .nav-rgt a
    {
      text-decoration: none;
      position: relative; 
      color: #000;
    }
    .nav-rgt 
    {
      display: flex;
      flex-direction: row;
      gap: 25px;
    }
    .wish-main
    {
      width: 100%;
      padding: 30px 20px;
    }

    .wish-hdng
    {
      text-align: center;
      font-size: 40px;
      color: var(--txt);
      font-family:'Poppins', sans-serif;
      margin-bottom: 30px;
    }

    .wish-items
    {
      width: 100%;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .card
    {
      width: 300px;
      height: auto;
      border-radius: 15px;
      background-color: #FFF3DA;
      border: #E8D8C8;
    }
    .card img
    {
      width: 100%;
      height: 290px;
      border-radius: 15px;
      object-fit: cover;
    }
    .display-prdct-row
    {
      display: flex;
      flex-direction: row;
      gap: 20px;
      height: 65vh;
      width: 100%;
      justify-content: center;
      align-items: center;
    }
    .display-prdct-two
    {
      display: flex;
      flex-direction: row;
      gap: 20px;
    }
    #cart-count
    {
      color: #000;
    }
    .product-description
    {
      padding: 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .product-name
    {
      font-size: 19px;
    }
    .prduct-price
    {
      color: #2D211E;
      font-size: 19px;
    }
    .btn
    {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: var(--txt);
      color: #fff3e3;
      cursor: pointer;
    }

    .btn-red
    {
      background: #e63946;
    }

    .empty-txt
    {
      width: 100%;
      text-align: center;
      font-size: 20px;
      color: #762E3F;
      margin-top: 50px;
    }

    .back-btn
    {
      display: block;
      width: 200px;
      margin: 0 auto 20px auto;
      padding: 10px;
      background-color: var(--bgtwo);
      color: #fff3e3;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
    }
    @media(max-width:480px)
    {
      .logo
      {
        font-size: 1.4rem;
      }
    }
</style>
<body>
  <header>
    <div class="navbar">
      <div class="nav-lft">
        <div class="logo">CRUMB & CROWN</div>
      </div>
      <div class="nav-rgt">
        <a href="index.html">Home</a>
        <a href="cart.html">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="wish-main">
    <a href="index.html" class="back-btn">← Back to Shop</a>
    <div class="wish-hdng">Your Wishlist</div>
    <div class="wish-items" id="wish-container"></div>
  </div>

  <script>
    let wishlist = JSON.parse(localStorage.getItem('crumb_wishlist')) || [];
    let cart = JSON.parse(localStorage.getItem('crumb_cart')) || [];
    const container = document.getElementById('wish-container');

    function saveToStorage()
    {
      localStorage.setItem('crumb_wishlist', JSON.stringify(wishlist));
      localStorage.setItem('crumb_cart', JSON.stringify(cart));
    }

    function updateCounts()
    {
      const cartCountEl = document.getElementById('cart-count');
      if(cartCountEl) cartCountEl.innerText = cart.reduce((total, item) => total + item.qty, 0);
    }

    function renderWishlist()
    {
      container.innerHTML = '';
      if (wishlist.length === 0)
      {
        container.innerHTML = '<div class="empty-txt">Your wishlist is empty</div>';
        updateCounts();
        return;
      }

      wishlist.forEach((item) =>
      {
        container.innerHTML += `
          <div class="card">
            <div class="card"><img src="${item.img}"></div>
            <div class="product-description">
              <div class="product-name">${item.name}</div>
              <div class="prduct-price">Rs.${item.price.toLocaleString('en-IN')}</div>
              <div class="product-row">
                <button class="btn" onclick="moveToCart('${item.id}')">Add to Cart</button>
                <button class="btn btn-red" onclick="removeItem('${item.id}')">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      });
      updateCounts();
    }

    function removeItem(id)
    {
      wishlist = wishlist.filter(p => p.id !== id);
      saveToStorage();
      renderWishlist();
    }

    function moveToCart(id)
    {
      const item = wishlist.find(p => p.id === id);
      const existing = cart.find(p => p.id === id);
      if (existing) existing.qty++;
      else cart.push({...item, qty: 1});
      removeItem(id);
      alert(item.name + ' moved to Cart!');
    }

    renderWishlist();
  </script>
</body>
</html>
